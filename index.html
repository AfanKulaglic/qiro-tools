    <!--
      Short-link fast path. Runs before the React bundle so a short link opens
      essentially instantly â€” we read the destination straight from the Firebase
      Realtime Database REST API and hard-redirect, with no app load and no
      loading screen. Slugs are lowercase alnum with no dashes; every real route
      either contains a dash or is listed in RESERVED, so pages fall through and
      load the app normally. Anything unknown does one tiny lookup: a hit
      redirects, a miss un-hides and lets the app render its not-found page.
    -->
    <script>
      (function () {
        try {
          var m = location.pathname.match(/^\/(?:s\/)?([a-z0-9]{4,24})$/)
          if (!m) return
          var slug = m[1]
          var RESERVED = {
            shorten: 1, qr: 1, convert: 1, features: 1, pricing: 1, about: 1,
            contact: 1, help: 1, faq: 1, history: 1, privacy: 1, terms: 1,
            admin: 1, dashboard: 1, login: 1, signup: 1, api: 1, s: 1,
            settings: 1, support: 1, blog: 1, client: 1, user: 1, product: 1,
            icons: 1, hero: 1, studio: 1
          }
          if (RESERVED[slug]) return
          var root = document.documentElement
          root.style.visibility = 'hidden'
          var done = false
          var reveal = function () { if (!done) { done = true; root.style.visibility = '' } }
          setTimeout(reveal, 2500) // never hide for longer than this
          var base = 'https://qiro-a23a4-default-rtdb.firebaseio.com/links/' + slug
          fetch(base + '/longUrl.json', { priority: 'high' })
            .then(function (r) { return r.ok ? r.json() : null })
            .then(function (url) {
              if (done) return
              if (typeof url === 'string' && url) {
                done = true
                // Count the click without delaying the redirect (keepalive lets
                // it finish after we navigate away). Atomic server-side increment.
                try {
                  fetch(base + '.json', {
                    method: 'PATCH',
                    keepalive: true,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ clicks: { '.sv': { increment: 1 } }, lastClickedAt: { '.sv': 'timestamp' } })
                  })
                } catch (e) {}
                location.replace(url)
              } else reveal()
            })
            .catch(reveal)
        } catch (e) {}
      })()
    </script>
